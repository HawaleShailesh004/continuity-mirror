name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      YOUCAM_MODE: mock
      KV_DRIVER: memory
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: No known high-severity vulnerabilities in production dependencies
        run: pnpm audit --prod --audit-level=high
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm guardrail
      - name: API docs are up to date
        run: pnpm api:docs && git diff --exit-code docs/API.md docs/openapi.json
      - run: pnpm build
      - run: pnpm check:secrets
